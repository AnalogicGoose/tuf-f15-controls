name: build-kext
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: host crypto test
        run: cd test && clang++ -std=c++17 -I../src wpa_test.cpp ../src/itl_wpa.cpp -o wpa_test && ./wpa_test
      - run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kexts
          path: build/*.kext
